<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Portfolio Website</title>
</head>
<body>
    <section class="hero">
        <!-- LEFT SIDE CONTENT OF THE PAGE -->
         <div class="hero_content">
            <p class="greet">
                HELLO THERE I AM
            </p>
            <h1>AISHWARYA <br> <span>GUDEKAR</span> </h1>
            <p class="intro">Artificial Intelligence Student | Flutter Developer | Computer Vision Enthusiast</p>
            <div class="buttons">
                <a href="#" class="explore-btn">Explore My Work</a>
                <a href="#" class="git-btn">Github</a>
            </div>
         </div>
         <!-- Right side of the screen -->
          <div class="hub-container">
            <div class="communication-hub">
                <div class="connection ai"></div>
                <div class="connection flutter"></div>
                <div class="connection python"></div>
                <div class="connection blender"></div>

                <div class="signal signal-ai">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="signal signal-flutter">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="signal signal-python">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="signal signal-systems">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="core-wrapper">
                    <div class="core-ripple ripple-one"></div>
                    <div class="core-ripple ripple-two"></div>
                    
                    <div class="core">
                        <div class="core-inner">
                            <span class="initials">
                                AG
                            </span>
                            <span class="core-status">
                                ONLINE
                            </span>
                        </div>
                    </div>
                </div>
                <div class="node node-ai">
                    <div class="wireless-wave">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="node-circle">
                        <div class="node-dot"></div>
                    </div>
                    <span class="node-label">AI/CV</span>
                </div>
                <div class="node node-flutter">
                    <div class="wireless-wave">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="node-circle">
                        <div class="node-dot"></div>
                    </div>
                    <span class="node-label">Flutter</span>
                </div>
                <div class="node node-python">
                    <div class="wireless-wave">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="node-circle">
                        <div class="node-dot"></div>
                    </div>
                    <span class="node-label">Python</span>
                </div>
                <div class="node node-blender">
                    <div class="wireless-wave">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="node-circle">
                        <div class="node-dot"></div>
                    </div>
                    <span class="node-label">Blender</span>
                </div>
            </div>
          </div>
    </section>
</body>
</html>
